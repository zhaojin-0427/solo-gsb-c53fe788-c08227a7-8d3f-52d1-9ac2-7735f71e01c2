services:
  fmp4-recover:
    build: .
    image: fmp4-recover:latest
    container_name: fmp4-recover
    ports:
      - "8000:8000"
    environment:
      # rebuilt files are kept here for download
      RECOVER_STORE: /data
      # results expire after this many seconds
      RECOVER_TTL_SECONDS: "3600"
    volumes:
      - fmp4-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  fmp4-data:
